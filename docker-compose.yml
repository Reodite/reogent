services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./ubc-unified-data/data:/data:ro
    environment:
      - DATABASE_URL=postgres://reodite:${POSTGRES_PASSWORD:-reodite}@postgres:5432/reodite
      - MEILI_URL=http://meilisearch:7700
      - HOSTNAME=0.0.0.0

  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./ubc-unified-data/data:/data:ro
    environment:
      - DATABASE_URL=postgres://reodite:${POSTGRES_PASSWORD:-reodite}@postgres:5432/reodite
      - MEILI_URL=http://meilisearch:7700
      - HOSTNAME=0.0.0.0

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reodite
      POSTGRES_USER: reodite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reodite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reodite"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meilisearch-key}
      MEILI_ENV: ${MEILI_ENV:-development}
    volumes:
      - msdata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  msdata:
