services:
  app:
    build: .
    restart: unless-stopped
    # Loopback only: serve the app through an HTTPS reverse proxy on this host.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./ubc-unified-data/data:/data:ro
    environment:
      - USE_EXTERNAL_MONGODB=${USE_EXTERNAL_MONGODB:-false}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/reodite?replicaSet=rs0}
      - DATABASE_URL=
      - POSTGRES_PASSWORD=
      - MEILI_URL=http://meilisearch:7700
      # The app reads with MEILI_API_KEY; keep the master key out of its environment.
      - MEILI_MASTER_KEY=
      - DATA_PATH=/data
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./ubc-unified-data/data:/data:ro
    environment:
      - USE_EXTERNAL_MONGODB=${USE_EXTERNAL_MONGODB:-false}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/reodite?replicaSet=rs0}
      - DATABASE_URL=
      - POSTGRES_PASSWORD=
      - MEILI_URL=http://meilisearch:7700
      - DATA_PATH=/data
      - HOSTNAME=0.0.0.0

  # One-off operator tasks: docker compose --profile ops run --rm ingest (or backup)
  ingest:
    profiles: ["ops"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run ingest"
    env_file: .env
    depends_on:
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./ubc-unified-data/data:/data
    environment:
      - MEILI_URL=http://meilisearch:7700
      - DATA_PATH=/data

  backup:
    profiles: ["ops"]
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    command: sh -c 'mongodump --uri="mongodb://mongo:27017/reodite?replicaSet=rs0" --archive="/backups/reodite-$$(date -u +%Y%m%dT%H%M%SZ).archive" --gzip'

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok ? quit(0) : quit(1) }
          catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(1) }'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - msdata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongodata:
  msdata:
