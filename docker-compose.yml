services:
  app:
    build: .
    restart: unless-stopped
    # Loopback only: serve the app through an HTTPS reverse proxy on this host.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./ubc-unified-data/data:/data:ro
    environment:
      - DATABASE_URL=postgres://reodite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/reodite
      - MEILI_URL=http://meilisearch:7700
      # The app reads with MEILI_API_KEY; keep the master key out of its environment.
      - MEILI_MASTER_KEY=
      - DATA_PATH=/data
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./ubc-unified-data/data:/data:ro
    environment:
      - DATABASE_URL=postgres://reodite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/reodite
      - MEILI_URL=http://meilisearch:7700
      - DATA_PATH=/data
      - HOSTNAME=0.0.0.0

  # One-off operator tasks: docker compose --profile ops run --rm ingest (or backup)
  ingest:
    profiles: ["ops"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run ingest"
    env_file: .env
    depends_on:
      meilisearch:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./ubc-unified-data/data:/data
    environment:
      - MEILI_URL=http://meilisearch:7700
      - DATA_PATH=/data

  backup:
    profiles: ["ops"]
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: sh -c 'pg_dump -h postgres -U reodite -Fc reodite > /backups/reodite-$$(date -u +%Y%m%dT%H%M%SZ).dump'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: reodite
      POSTGRES_USER: reodite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reodite"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - msdata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  msdata:
